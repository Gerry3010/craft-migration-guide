# Craft 6 stack: app (PHP-FPM), web (nginx), queue worker, one-shot asset
# publisher, MariaDB and Mailpit.
#
#   docker compose up -d --build
#
# Variables come from .env next to this file. Import the database before
# the first start of queue and publish (see the notes below).
name: craft6

x-app: &app
  image: craft6-app
  restart: unless-stopped
  env_file: .env
  volumes:
    - storage:/app/storage
    - public-vendor:/app/public/vendor
    - ./data/uploads:/app/public/uploads

services:
  db:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-craft}"
      MARIADB_USER: "${DB_USERNAME:-craft}"
      MARIADB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD missing}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD missing}"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    <<: *app
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    depends_on:
      db:
        condition: service_healthy

  # Craft only publishes plugin assets (e.g. CKEditor's Vite build) when it
  # sees an installed database. The image build has none, so this runs on
  # every start and writes into the public-vendor volume that nginx reads.
  # Without it /admin/login fails with "Vite manifest not found".
  publish:
    <<: *app
    restart: "no"
    user: www-data
    command: ["php", "artisan", "craft:setup:publish", "--ansi"]
    depends_on:
      db:
        condition: service_healthy

  # Mails and image transforms go through the Laravel queue. Without a
  # worker they stay in the jobs table. On an empty database this worker
  # restarts in a loop, so import the dump first.
  queue:
    <<: *app
    user: www-data
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    depends_on:
      - app

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      publish:
        condition: service_completed_successfully
    ports:
      # Localhost only; TLS ends at the host's reverse proxy.
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    volumes:
      - public-vendor:/app/public/vendor:ro
      - ./data/uploads:/app/public/uploads:ro

  # Catches every outgoing mail of a test instance. Point MAIL_HOST at
  # mailpit and MAIL_PORT at 1025. Remove it for a real production stack.
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"

volumes:
  db-data:
  storage:
  public-vendor:
