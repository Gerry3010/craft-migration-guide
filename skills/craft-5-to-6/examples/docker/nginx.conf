server {
    listen 80;
    server_name _;
    root /app/public;
    index index.php;
    client_max_body_size 64m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Craft can render robots.txt from a template; there is no file.
    location = /robots.txt {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    # Never execute uploaded PHP. Must come before the \.php$ location:
    # nginx uses the first regex location that matches, in file order.
    location ~* ^/uploads/.*\.(php|phtml|phar)$ {
        types { }
        default_type text/plain;
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        # The script lives in the app container, not here.
        fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 120s;
    }

    location ~* \.(css|js|woff2?|svg|ico)$ {
        try_files $uri /index.php?$query_string;
        expires 30d;
        access_log off;
    }

    location ~ /\. {
        deny all;
    }
}
